services:
  redroid:
    image: redroid/redroid:11.0.0-latest
    container_name: redroid
    privileged: true
    ports:
      - "5555:5555"
    volumes:
      - redroid-data:/data
    command:
      - androidboot.hardware=redroid
      - androidboot.redroid.width=1080
      - androidboot.redroid.height=1920
      - androidboot.redroid.dpi=480
      - androidboot.redroid.gpu.mode=guest
    restart: always

  ws-scrcpy:
    image: netptop/site-scrcpy:latest
    container_name: ws-scrcpy
    ports:
      - "8000:8000"
    depends_on:
      - redroid
    restart: always

  snapbot:
    build: .
    container_name: snapbot
    depends_on:
      - redroid
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
    restart: always

volumes:
  redroid-data:
