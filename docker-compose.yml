services:
  redroid:
    image: redroid/redroid:11.0.0-latest
    container_name: redroid
    privileged: true
    network_mode: host
    volumes:
      - redroid-data:/data
    command:
      - androidboot.hardware=redroid
      - androidboot.redroid.width=1080
      - androidboot.redroid.height=1920
      - androidboot.redroid.dpi=480
      - androidboot.redroid.gpu.mode=guest
    restart: always

  snapbot:
    build: .
    container_name: snapbot
    network_mode: host
    depends_on:
      - redroid
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - ADB_HOST=127.0.0.1
      - ADB_PORT=5555
    restart: always

volumes:
  redroid-data:
