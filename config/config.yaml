adb:
  host: "127.0.0.1"
  port: 5555
  connect_timeout_seconds: 15
  command_timeout_seconds: 30
  max_reconnect_attempts: 3

redroid:
  container_name: "redroid"
  docker_socket: "unix:///var/run/docker.sock"
  docker_service_name: "docker"

snapchat:
  package_name: "com.snapchat.android"
  activity_name: "com.snap.snapchat.LandingPageActivity"
  launch_timeout_seconds: 25
  element_timeout_seconds: 10
  recipients:
    - "friend_user1"
    - "friend_user2"

schedule:
  time_windows:
    - start_time: "09:00"
      end_time: "11:00"
    - start_time: "20:00"
      end_time: "22:00"
  max_retries: 3
  retry_delay_seconds: 300

watchdog:
  check_interval_seconds: 60
  max_tier: 5
  enable_host_reboot: false

database:
  path: "data/snapbot.db"

logging:
  log_level: "INFO"
  rotation: "10 MB"
  retention: "30 days"

screenshot:
  directory: "screenshots"
  retention_days: 30
